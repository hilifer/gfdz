{% extends "base.html" %}
{% block title %}电站详情 - 光伏电站监控平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4><i class="bi bi-building"></i> 电站详情: <span id="station-name">加载中...</span></h4>
    <div>
        <button class="btn btn-primary" onclick="syncStation(stationId)">
            <i class="bi bi-arrow-repeat"></i> 同步数据
        </button>
        <a href="/stations" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
    </div>
</div>

<!-- 电站信息卡片 -->
<div class="row mb-4">
    <div class="col-md-3 mb-3">
        <div class="card stat-card bg-primary text-white h-100">
            <div class="card-body text-center">
                <h6>当前功率</h6>
                <h3><span id="current-power">-</span> kW</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card stat-card bg-success text-white h-100">
            <div class="card-body text-center">
                <h6>今日发电</h6>
                <h3><span id="daily-gen">-</span> kWh</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card stat-card bg-info text-white h-100">
            <div class="card-body text-center">
                <h6>累计发电</h6>
                <h3><span id="total-gen">-</span> kWh</h3>
            </div>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card stat-card bg-warning text-dark h-100">
            <div class="card-body text-center">
                <h6>装机容量</h6>
                <h3><span id="capacity">-</span> kWp</h3>
            </div>
        </div>
    </div>
</div>

<!-- 发电趋势 -->
<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header"><i class="bi bi-graph-up"></i> 近30日发电趋势</div>
            <div class="card-body">
                <canvas id="gen-trend-chart" height="80"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 发电数据 & 告警 -->
<div class="row">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header"><i class="bi bi-table"></i> 发电数据记录</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>日发电(kWh)</th>
                                <th>月累计(kWh)</th>
                                <th>峰值功率(kW)</th>
                                <th>等效小时</th>
                                <th>PR值</th>
                                <th>日收益(元)</th>
                            </tr>
                        </thead>
                        <tbody id="gen-tbody">
                            <tr><td colspan="7" class="text-center text-muted">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><i class="bi bi-bell"></i> 最近告警</div>
            <div class="card-body">
                <div id="alarm-list">
                    <p class="text-center text-muted">加载中...</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const stationId = {{ station_id }};

document.addEventListener('DOMContentLoaded', loadStationDetail);

async function loadStationDetail() {
    const [station, genData, alarms] = await Promise.all([
        api(`/api/stations/${stationId}`),
        api(`/api/stations/${stationId}/generation?limit=30`),
        api(`/api/stations/${stationId}/alarms?limit=20`),
    ]);

    // 基本信息
    document.getElementById('station-name').textContent = station.name;
    document.getElementById('capacity').textContent = station.capacity || '-';

    // 最新发电数据
    if (genData.length > 0) {
        const latest = genData[0];
        document.getElementById('current-power').textContent = latest.current_power ?? '-';
        document.getElementById('daily-gen').textContent = latest.daily_generation ?? '-';
        document.getElementById('total-gen').textContent = latest.total_generation ?? '-';
    }

    // 发电趋势图
    const chartData = genData.slice().reverse();
    const ctx = document.getElementById('gen-trend-chart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: chartData.map(d => d.record_date),
            datasets: [{
                label: '日发电量(kWh)',
                data: chartData.map(d => d.daily_generation),
                borderColor: '#0d6efd',
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                fill: true, tension: 0.3
            }]
        },
        options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    // 发电数据表格
    const tbody = document.getElementById('gen-tbody');
    tbody.innerHTML = genData.length === 0
        ? '<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>'
        : genData.map(d => `<tr>
            <td>${d.record_date}</td>
            <td>${d.daily_generation ?? '-'}</td>
            <td>${d.monthly_generation ?? '-'}</td>
            <td>${d.daily_peak_power ?? '-'}</td>
            <td>${d.equivalent_hours ?? '-'}</td>
            <td>${d.pr_value ?? '-'}</td>
            <td>${d.daily_income ?? '-'}</td>
        </tr>`).join('');

    // 告警列表
    const alarmDiv = document.getElementById('alarm-list');
    if (alarms.length === 0) {
        alarmDiv.innerHTML = '<p class="text-center text-muted">暂无告警</p>';
    } else {
        alarmDiv.innerHTML = alarms.map(a => `
            <div class="alert alert-${a.alarm_level === 'critical' ? 'danger' : a.alarm_level === 'warning' ? 'warning' : 'info'} py-2 mb-2">
                <div class="d-flex justify-content-between">
                    <strong>${a.alarm_name}</strong>
                    <span class="badge bg-${a.status === 'active' ? 'danger' : 'success'}">${a.status === 'active' ? '活跃' : '已恢复'}</span>
                </div>
                <small class="text-muted">${a.alarm_time} | ${a.device_name || ''}</small>
                ${a.description ? `<br><small>${a.description}</small>` : ''}
            </div>
        `).join('');
    }
}
</script>
{% endblock %}
