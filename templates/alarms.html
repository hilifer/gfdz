{% extends "base.html" %}
{% block title %}告警中心 - 光伏电站监控平台{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4><i class="bi bi-bell"></i> 告警中心</h4>
    <div>
        <select class="form-select form-select-sm d-inline-block w-auto" id="alarm-filter" onchange="loadAlarms()">
            <option value="">全部状态</option>
            <option value="active">活跃</option>
            <option value="recovered">已恢复</option>
        </select>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>电站</th>
                        <th>设备</th>
                        <th>告警名称</th>
                        <th>级别</th>
                        <th>告警时间</th>
                        <th>恢复时间</th>
                        <th>状态</th>
                        <th>描述</th>
                    </tr>
                </thead>
                <tbody id="alarms-tbody">
                    <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadAlarms);

async function loadAlarms() {
    const stations = await api('/api/stations');
    const status = document.getElementById('alarm-filter').value;
    const tbody = document.getElementById('alarms-tbody');

    let allAlarms = [];
    for (const s of stations) {
        let url = `/api/stations/${s.id}/alarms?limit=50`;
        if (status) url += `&status=${status}`;
        const alarms = await api(url);
        alarms.forEach(a => a._station_name = s.name);
        allAlarms = allAlarms.concat(alarms);
    }

    allAlarms.sort((a, b) => new Date(b.alarm_time) - new Date(a.alarm_time));

    if (allAlarms.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无告警</td></tr>';
        return;
    }

    tbody.innerHTML = allAlarms.map(a => `<tr>
        <td>${a._station_name}</td>
        <td>${a.device_name || '-'}</td>
        <td>${a.alarm_name}</td>
        <td><span class="badge bg-${a.alarm_level === 'critical' ? 'danger' : a.alarm_level === 'warning' ? 'warning' : 'info'}">${a.alarm_level}</span></td>
        <td>${a.alarm_time}</td>
        <td>${a.recover_time || '-'}</td>
        <td><span class="badge bg-${a.status === 'active' ? 'danger' : 'success'}">${a.status === 'active' ? '活跃' : '已恢复'}</span></td>
        <td>${a.description || '-'}</td>
    </tr>`).join('');
}
</script>
{% endblock %}
