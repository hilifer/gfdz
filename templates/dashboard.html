{% extends "base.html" %}
{% block title %}仪表盘 - 光伏电站监控平台{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h4><i class="bi bi-speedometer2"></i> 监控总览</h4>
    </div>
</div>

<!-- 统计卡片 -->
<div class="row mb-4" id="summary-cards">
    <div class="col-md-3 col-sm-6 mb-3">
        <div class="card stat-card bg-primary text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-subtitle mb-1">电站总数</h6>
                        <h3 class="card-title" id="station-count">-</h3>
                    </div>
                    <div class="stat-icon"><i class="bi bi-building"></i></div>
                </div>
                <small>活跃: <span id="active-count">-</span></small>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-6 mb-3">
        <div class="card stat-card bg-success text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-subtitle mb-1">总装机容量</h6>
                        <h3 class="card-title"><span id="total-capacity">-</span> kWp</h3>
                    </div>
                    <div class="stat-icon"><i class="bi bi-lightning"></i></div>
                </div>
                <small>厂家: <span id="manufacturer-count">-</span> 家</small>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-6 mb-3">
        <div class="card stat-card bg-info text-white">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-subtitle mb-1">今日发电量</h6>
                        <h3 class="card-title"><span id="today-generation">-</span> kWh</h3>
                    </div>
                    <div class="stat-icon"><i class="bi bi-sun"></i></div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-3 col-sm-6 mb-3">
        <div class="card stat-card bg-warning text-dark">
            <div class="card-body">
                <div class="d-flex justify-content-between">
                    <div>
                        <h6 class="card-subtitle mb-1">活跃告警</h6>
                        <h3 class="card-title" id="active-alarms">-</h3>
                    </div>
                    <div class="stat-icon"><i class="bi bi-bell"></i></div>
                </div>
                <small>故障电站: <span id="fault-count">-</span></small>
            </div>
        </div>
    </div>
</div>

<!-- 图表 -->
<div class="row mb-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-graph-up"></i> 近7日发电趋势
            </div>
            <div class="card-body">
                <canvas id="generation-chart" height="100"></canvas>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-pie-chart"></i> 电站状态分布
            </div>
            <div class="card-body">
                <canvas id="status-chart" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 电站状态列表 -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-ul"></i> 电站实时状态</span>
                <button class="btn btn-sm btn-outline-primary" onclick="loadDashboard()">
                    <i class="bi bi-arrow-clockwise"></i> 刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>电站名称</th>
                                <th>编码</th>
                                <th>装机容量(kWp)</th>
                                <th>当前功率(kW)</th>
                                <th>今日发电(kWh)</th>
                                <th>状态</th>
                                <th>最后同步</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="station-table-body">
                            <tr><td colspan="8" class="text-center text-muted">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadDashboard);

async function loadDashboard() {
    await Promise.all([loadSummary(), loadTrend(), loadStationStatus()]);
}

async function loadSummary() {
    try {
        const data = await api('/api/dashboard/summary');
        document.getElementById('station-count').textContent = data.station_count;
        document.getElementById('active-count').textContent = data.active_count;
        document.getElementById('total-capacity').textContent = data.total_capacity;
        document.getElementById('manufacturer-count').textContent = data.manufacturer_count;
        document.getElementById('today-generation').textContent = data.today_generation;
        document.getElementById('active-alarms').textContent = data.active_alarms;
        document.getElementById('fault-count').textContent = data.fault_count;
    } catch(e) { console.error(e); }
}

let genChart = null;
async function loadTrend() {
    try {
        const data = await api('/api/dashboard/generation_trend?days=7');
        const ctx = document.getElementById('generation-chart').getContext('2d');
        if (genChart) genChart.destroy();
        genChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.date),
                datasets: [{
                    label: '发电量(kWh)',
                    data: data.map(d => d.generation),
                    backgroundColor: 'rgba(54, 162, 235, 0.6)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
    } catch(e) { console.error(e); }
}

let statusChart = null;
async function loadStationStatus() {
    try {
        const data = await api('/api/dashboard/station_status');
        // 表格
        const tbody = document.getElementById('station-table-body');
        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无电站数据，请先添加电站</td></tr>';
        } else {
            tbody.innerHTML = data.map(s => `
                <tr>
                    <td><a href="/stations/${s.id}">${s.name}</a></td>
                    <td>${s.station_code}</td>
                    <td>${s.capacity || '-'}</td>
                    <td>${s.current_power != null ? s.current_power : '-'}</td>
                    <td>${s.daily_generation != null ? s.daily_generation : '-'}</td>
                    <td>${statusBadge(s.status)}</td>
                    <td>${s.last_sync_at || '未同步'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="syncStation(${s.id})">
                            <i class="bi bi-arrow-repeat"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 状态饼图
        const statusMap = {};
        data.forEach(s => { statusMap[s.status] = (statusMap[s.status] || 0) + 1; });
        const ctx = document.getElementById('status-chart').getContext('2d');
        if (statusChart) statusChart.destroy();
        const labels = Object.keys(statusMap).map(s => s === 'normal' ? '正常' : s === 'fault' ? '故障' : '离线');
        const colors = Object.keys(statusMap).map(s => s === 'normal' ? '#198754' : s === 'fault' ? '#dc3545' : '#6c757d');
        statusChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{ data: Object.values(statusMap), backgroundColor: colors }]
            },
            options: { responsive: true }
        });
    } catch(e) { console.error(e); }
}
</script>
{% endblock %}
