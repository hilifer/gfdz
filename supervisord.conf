[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
command=su postgres -c "postgres -D /var/lib/postgresql/data"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/postgresql.log
stderr_logfile=/var/log/postgresql_err.log

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/redis.log
stderr_logfile=/var/log/redis_err.log

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app/backend
autostart=true
autorestart=true
priority=30
startsecs=5
startretries=5
stdout_logfile=/var/log/backend.log
stderr_logfile=/var/log/backend_err.log
environment=DATABASE_URL="postgresql+asyncpg://gfdz:gfdz123456@127.0.0.1:5432/gfdz",REDIS_URL="redis://127.0.0.1:6379/0",JWT_SECRET="your-jwt-secret-change-in-production",JWT_ALGORITHM="HS256",JWT_EXPIRE_MINUTES="1440"

[program:celery-worker]
command=celery -A app.tasks.celery_app worker --loglevel=info
directory=/app/backend
autostart=true
autorestart=true
priority=40
startsecs=10
stdout_logfile=/var/log/celery_worker.log
stderr_logfile=/var/log/celery_worker_err.log
environment=DATABASE_URL="postgresql+asyncpg://gfdz:gfdz123456@127.0.0.1:5432/gfdz",REDIS_URL="redis://127.0.0.1:6379/0",JWT_SECRET="your-jwt-secret-change-in-production"

[program:celery-beat]
command=celery -A app.tasks.celery_app beat --loglevel=info
directory=/app/backend
autostart=true
autorestart=true
priority=40
startsecs=10
stdout_logfile=/var/log/celery_beat.log
stderr_logfile=/var/log/celery_beat_err.log
environment=DATABASE_URL="postgresql+asyncpg://gfdz:gfdz123456@127.0.0.1:5432/gfdz",REDIS_URL="redis://127.0.0.1:6379/0",JWT_SECRET="your-jwt-secret-change-in-production"

[program:frontend]
command=npx nuxt dev --host 127.0.0.1 --port 3000
directory=/app/frontend
autostart=true
autorestart=true
priority=30
startsecs=10
stdout_logfile=/var/log/frontend.log
stderr_logfile=/var/log/frontend_err.log
environment=NUXT_PUBLIC_API_BASE="/api"

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=50
startsecs=2
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_err.log
