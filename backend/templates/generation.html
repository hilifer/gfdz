{% extends "base.html" %}
{% block title %}发电分析 - 光伏监控平台{% endblock %}
{% block page_title %}发电分析{% endblock %}

{% block content %}
<div class="card mb-6">
  <div class="flex flex-wrap items-center gap-3 mb-4">
    <div>
      <label class="form-label">开始日期</label>
      <input type="date" id="start-date" class="form-input" style="width:160px">
    </div>
    <div>
      <label class="form-label">结束日期</label>
      <input type="date" id="end-date" class="form-input" style="width:160px">
    </div>
    <div>
      <label class="form-label">电站</label>
      <select id="station-select" class="form-input" style="width:200px"></select>
    </div>
    <div class="pt-5">
      <button class="btn btn-primary" onclick="loadAnalysis()">查询</button>
    </div>
  </div>
</div>

<div id="summary-cards" class="grid grid-cols-3 gap-4 mb-6"></div>

<div class="card">
  <div class="card-title">发电趋势</div>
  <div id="chart-gen" class="chart-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!requireAuth()) throw '';

const now = new Date();
document.getElementById('end-date').value = now.toISOString().slice(0,10);
document.getElementById('start-date').value = new Date(now - 29*86400000).toISOString().slice(0,10);

(async function(){
  const res = await api('/stations?page_size=100');
  const list = res.items || [];
  const sel = document.getElementById('station-select');
  sel.innerHTML = '<option value="">全部电站</option>' + list.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
  loadAnalysis();
})();

async function loadAnalysis() {
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  const stationId = document.getElementById('station-select').value;

  try {
    const res = await api('/stations?page_size=100');
    const stations = res.items || [];
    const targets = stationId ? stations.filter(s => s.id == stationId) : stations.slice(0, 10);

    const dayMap = {};
    for (const st of targets) {
      try {
        const daily = await api(`/stations/${st.id}/daily?start=${start}&end=${end}`);
        (daily || []).forEach(d => {
          const key = (d.date || '').substring(0,10);
          dayMap[key] = (dayMap[key] || 0) + (d.generation_kwh || 0);
        });
      } catch(e) {}
    }

    const days = Object.keys(dayMap).sort();
    const totalGen = days.reduce((s, d) => s + (dayMap[d] || 0), 0);
    const avgGen = days.length ? totalGen / days.length : 0;

    document.getElementById('summary-cards').innerHTML = [
      dataCard('⚡', '总发电量', fmtNum(totalGen), 'kWh', 'green'),
      dataCard('📊', '日均发电', fmtNum(avgGen), 'kWh', 'blue'),
      dataCard('📅', '统计天数', days.length, '天', 'purple'),
    ].join('');

    const chart = echarts.init(document.getElementById('chart-gen'));
    chart.setOption({
      tooltip: { trigger: 'axis' },
      xAxis: { type: 'category', data: days.map(d => d.substring(5)) },
      yAxis: { type: 'value', name: 'kWh' },
      series: [{ type: 'bar', data: days.map(d => +(dayMap[d]||0).toFixed(1)), itemStyle: { color: '#16a34a', borderRadius: [4,4,0,0] } }]
    });
    window.addEventListener('resize', () => chart.resize());
  } catch(e) { toast('查询失败', 'error'); }
}
</script>
{% endblock %}
