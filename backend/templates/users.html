{% extends "base.html" %}
{% block title %}用户管理 - 光伏监控平台{% endblock %}
{% block page_title %}用户管理{% endblock %}

{% block content %}
<div class="card">
  <div id="user-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!requireAuth()) throw '';

(async function(){
  try {
    const list = await api('/system/users');
    const el = document.getElementById('user-list');
    if (!list.length) { el.innerHTML = '<p class="text-center text-gray-400 py-8">暂无用户</p>'; return; }
    el.innerHTML = `<table class="tbl"><thead><tr>
      <th>用户名</th><th>显示名称</th><th>角色</th><th>手机号</th><th>状态</th><th>最后登录</th>
    </tr></thead><tbody>` +
    list.map(u => `<tr>
      <td class="font-medium">${u.username}</td>
      <td>${u.display_name || '-'}</td>
      <td>${roleBadge(u.role)}</td>
      <td>${u.phone || '-'}</td>
      <td>${statusBadge(u.is_active !== false ? 'enabled' : 'disabled')}</td>
      <td class="text-xs text-gray-400">${fmtDate(u.last_login_at)}</td>
    </tr>`).join('') + '</tbody></table>';
  } catch(e) { document.getElementById('user-list').innerHTML = '<p class="text-center text-red-400 py-4">加载失败</p>'; }
})();
</script>
{% endblock %}
