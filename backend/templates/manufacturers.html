{% extends "base.html" %}
{% block title %}厂家管理 - 光伏监控平台{% endblock %}
{% block page_title %}厂家管理{% endblock %}

{% block content %}
<div id="mfr-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
{% endblock %}

{% block scripts %}
<script>
if (!requireAuth()) throw '';

async function syncMfr(id, btn) {
  btn.disabled = true; btn.textContent = '同步中...';
  try {
    await api(`/manufacturers/${id}/sync`, { method: 'POST' });
    toast('同步已触发', 'success');
    setTimeout(() => location.reload(), 2000);
  } catch(e) { toast(e.message, 'error'); }
  btn.disabled = false; btn.textContent = '立即同步';
}

(async function(){
  try {
    const list = await api('/manufacturers');
    const el = document.getElementById('mfr-list');
    if (!list.length) { el.innerHTML = '<p class="text-center text-gray-400 py-8 col-span-3">暂无厂家数据</p>'; return; }
    el.innerHTML = list.map(m => `
      <div class="card">
        <div class="flex items-center justify-between mb-3">
          <span class="font-bold text-gray-800 text-lg">${m.name}</span>
          ${statusBadge(m.is_active ? 'normal' : 'offline')}
        </div>
        <div class="text-sm text-gray-500 space-y-1 mb-3">
          <div>编码: <span class="text-gray-700">${m.code || '-'}</span></div>
          <div>API地址: <span class="text-gray-700 text-xs break-all">${m.api_base_url || '-'}</span></div>
          <div>同步间隔: <span class="text-gray-700">${m.sync_interval || '-'} 秒</span></div>
          <div>最后同步: <span class="text-gray-700">${fmtDate(m.last_sync_at)}</span></div>
        </div>
        <button class="btn btn-sm btn-primary w-full justify-center" onclick="syncMfr(${m.id}, this)">立即同步</button>
      </div>
    `).join('');
  } catch(e) { document.getElementById('mfr-list').innerHTML = '<p class="text-center text-red-400 py-4">加载失败</p>'; }
})();
</script>
{% endblock %}
