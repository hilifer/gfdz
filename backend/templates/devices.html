{% extends "base.html" %}
{% block title %}设备管理 - 光伏监控平台{% endblock %}
{% block page_title %}设备管理{% endblock %}

{% block content %}
<div class="card">
  <div class="flex items-center gap-3 mb-4">
    <select id="type-filter" class="form-input" style="width:150px" onchange="loadDevices()">
      <option value="">全部类型</option>
      <option value="inverter">逆变器</option>
      <option value="meter">电表</option>
      <option value="combiner_box">汇流箱</option>
      <option value="weather_station">气象站</option>
      <option value="storage">储能</option>
    </select>
    <select id="status-filter" class="form-input" style="width:140px" onchange="loadDevices()">
      <option value="">全部状态</option>
      <option value="normal">正常</option>
      <option value="fault">故障</option>
      <option value="offline">离线</option>
    </select>
  </div>
  <div id="device-list"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
if (!requireAuth()) throw '';

const typeMap = { inverter:'逆变器', meter:'电表', combiner_box:'汇流箱', weather_station:'气象站', storage:'储能' };

async function loadDevices() {
  const type = document.getElementById('type-filter').value;
  const status = document.getElementById('status-filter').value;
  let url = '/devices?limit=200';
  if (type) url += `&device_type=${type}`;
  if (status) url += `&status=${status}`;
  try {
    const res = await api(url);
    const list = res.items || res || [];
    const el = document.getElementById('device-list');
    if (!list.length) { el.innerHTML = '<p class="text-center text-gray-400 py-8">暂无设备数据</p>'; return; }
    el.innerHTML = `<table class="tbl"><thead><tr>
      <th>设备名称</th><th>所属电站</th><th>类型</th><th>品牌型号</th><th>额定功率(kW)</th><th>状态</th><th>最后更新</th>
    </tr></thead><tbody>` +
    list.map(d => `<tr class="cursor-pointer" onclick="location.href='/devices/${d.id}'">
      <td class="font-medium">${d.name || '-'}</td>
      <td>${d.station_name || '-'}</td>
      <td>${typeMap[d.device_type] || d.device_type || '-'}</td>
      <td>${[d.brand, d.model].filter(Boolean).join(' ') || '-'}</td>
      <td>${d.rated_power != null ? d.rated_power : '-'}</td>
      <td>${statusBadge(d.status)}</td>
      <td class="text-xs text-gray-400">${fmtDate(d.updated_at)}</td>
    </tr>`).join('') + '</tbody></table>';
  } catch(e) { document.getElementById('device-list').innerHTML = '<p class="text-center text-red-400 py-4">加载失败</p>'; }
}
loadDevices();
</script>
{% endblock %}
