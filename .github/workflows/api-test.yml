name: Test Manufacturer APIs
on:
  workflow_dispatch:

jobs:
  test-apis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install httpx
      - name: Test AiSWEI API
        run: python .github/scripts/test_aiswei.py
      - name: Test Solis API
        run: python .github/scripts/test_solis.py || true
