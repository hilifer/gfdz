services:
  gfdz:
    build: .
    restart: unless-stopped
    ports:
      - "5001:80"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 源代码挂载 — 改了代码 git pull 立刻生效，不用重建镜像
      - ./backend:/app/backend
    environment:
      POSTGRES_DB: gfdz
      POSTGRES_USER: gfdz
      POSTGRES_PASSWORD: gfdz123456
      DATABASE_URL: postgresql+asyncpg://gfdz:gfdz123456@localhost:5432/gfdz
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440

volumes:
  pgdata:
